# ============================================================
# 电商 AI Agent — 基础设施层
# 包含：PostgreSQL / Redis / Milvus
# 启动：docker compose up -d
# 停止：docker compose down
# 清数据：docker compose down -v
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL — 结构化数据库
  # 存储：用户、商品、订单、客服记录
  # ----------------------------------------------------------
  postgres:
    image: postgres:17.9
    container_name: ecommerce-postgres
    restart: always
    environment:
      POSTGRES_USER: medical
      POSTGRES_PASSWORD: medical123
      POSTGRES_DB: ecommerce_agent
    volumes:
      - ./docker/postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medical -d ecommerce_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Redis — 短期记忆
  # 存储：会话级对话上下文，TTL 自动过期
  # ----------------------------------------------------------
  redis:
    image: redis/redis-stack:7.4.0-v3
    container_name: ecommerce-redis
    restart: always
    environment:
      REDIS_ARGS: "--appendonly yes"
    volumes:
      - ./docker/redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Milvus 依赖：etcd — 元数据存储
  # ----------------------------------------------------------
  etcd:
    container_name: ecommerce-milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: >
      etcd
      --advertise-client-urls=http://etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - ./docker/etcd_data:/etcd
    networks:
      - ecommerce-net

  # ----------------------------------------------------------
  # Milvus 依赖：MinIO — 对象存储
  # ----------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: ecommerce-minio
    restart: always
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - ./docker/minio_data:/minio_data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ----------------------------------------------------------
  # Milvus — 向量数据库
  # 存储：商品向量、知识库、长期记忆
  # ----------------------------------------------------------
  milvus:
    container_name: ecommerce-milvus
    image: milvusdb/milvus:v2.6.13
    command: ["milvus", "run", "standalone"]
    security_opt:
    - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - ./docker/milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ----------------------------------------------------------
  # Attu — Milvus 可视化客户端
  # ----------------------------------------------------------
  attu:
    container_name: ecommerce-attu
    image: zilliz/attu:latest
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "3000:3000"
    depends_on:
      - milvus
    networks:
      - ecommerce-net

# ----------------------------------------------------------
# 网络
# ----------------------------------------------------------
networks:
  ecommerce-net:
    driver: bridge
